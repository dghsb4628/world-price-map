<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界の物価マップ（ツールチップ付き）</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f9f9f9;
        }
        #map-container {
            display: inline-block;
            margin-top: 20px;
            background-color: #e0f7fa; 
            border: 1px solid #ccc;
            border-radius: 8px;
            position: relative;
        }
        .country {
            stroke: #ffffff;
            stroke-width: 0.5px;
            transition: stroke-width 0.2s; /* ホバー時の枠線アニメーション */
        }
        /* ホバー（マウスオーバー）時の国のスタイル */
        .country:hover {
            stroke: #333333;
            stroke-width: 1.5px;
            cursor: pointer;
        }
        .price-text {
            font-size: 10px;
            font-weight: bold;
            fill: #ffffff;
            text-shadow: 1px 1px 2px black, -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black;
            text-anchor: middle;
            pointer-events: none; /* テキストがマウス操作の邪魔をしないようにする */
        }
        /* ツールチップ（ポップアップ）のデザイン */
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            border: 1px solid #666;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none; /* ツールチップ自体がマウス操作の邪魔をしないようにする */
            opacity: 0; /* 最初は透明（非表示） */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            text-align: left;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>世界の物価マップ</h1>
    <p>🔵 物価が低い 〜 🔴 物価が高い</p>
    
    <div id="map-container"></div>

    <script>
        const width = 900;
        const height = 500;

        const svg = d3.select("#map-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // ツールチップ用のdiv要素をbodyに追加
        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip");

        const projection = d3.geoMercator()
            .scale(130)
            .translate([width / 2, height / 1.5]);
        const path = d3.geoPath().projection(projection);

        // サンプルの物価データ（0〜100の指数）
        const priceData = {
            "USA": 85,
            "JPN": 75,
            "CHN": 50,
            "IND": 25,
            "GBR": 80,
            "FRA": 78,
            "CHE": 95,
            "ZAF": 40,
            "BRA": 45,
            "AUS": 88,
            "RUS": 35
        };

        const colorScale = d3.scaleLinear()
            .domain([0, 100])
            .range(["blue", "red"]);

        d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson").then(function(data) {
            
            // 国の形を描画し、色を塗り、マウスイベントを追加
            svg.append("g")
                .selectAll("path")
                .data(data.features)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", function(d) {
                    const price = priceData[d.id];
                    return price !== undefined ? colorScale(price) : "#cccccc";
                })
                // マウスが国に乗った時の処理
                .on("mouseover", function(event, d) {
                    const price = priceData[d.id];
                    const countryName = d.properties.name; // GeoJSONから国名を取得
                    const priceText = price !== undefined ? `物価指数: <strong>${price}</strong>` : "データなし";
                    
                    // ツールチップの内容を設定して表示
                    tooltip.style("opacity", 1)
                           .html(`<strong>${countryName}</strong><br>${priceText}`);
                })
                // マウスが国の上を動いている時の処理（カーソルに追従）
                .on("mousemove", function(event) {
                    tooltip.style("left", (event.pageX + 15) + "px")
                           .style("top", (event.pageY - 20) + "px");
                })
                // マウスが国から離れた時の処理
                .on("mouseout", function() {
                    tooltip.style("opacity", 0); // ツールチップを隠す
                });

            // 国の中央に物価の数値を表示する（前回と同じ）
            svg.append("g")
                .selectAll("text")
                .data(data.features)
                .enter()
                .append("text")
                .attr("class", "price-text")
                .attr("x", function(d) { return path.centroid(d)[0]; })
                .attr("y", function(d) { return path.centroid(d)[1]; })
                .text(function(d) {
                    const price = priceData[d.id];
                    if (price !== undefined && !isNaN(path.centroid(d)[0])) {
                        return price;
                    }
                    return ""; 
                });
        });
    </script>

</body>
</html>
